# Дополнительная настройка для старых движков Docker (младше 20.10).
#
# ЗАЧЕМ. Начиная с glibc 2.34 (Debian 12 и новее) создание потоков использует
# системный вызов clone3. Профиль seccomp в Docker до 20.10 его запрещает, и
# приложение падает на старте: «RuntimeError: can't start new thread». То же
# самое ломало установку зависимостей через pip.
#
# ЧТО ДЕЛАЕМ. Снимаем фильтр seccomp у контейнера. Это ослабление защиты,
# поэтому применяется ТОЛЬКО на старом движке и только для этого сервиса:
# установщик определяет версию и подключает файл сам.
#
# На современном Docker (20.10 и новее) файл не нужен и не подключается.
# no-new-privileges остаётся: запрет на повышение привилегий не зависит от
# seccomp и продолжает действовать.

services:
  registry:
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
