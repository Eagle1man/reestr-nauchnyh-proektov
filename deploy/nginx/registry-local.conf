# =====================================================================
#  Реестр научных проектов — локальная установка на виртуальной машине.
#
#  Отличие от registry.conf: там домен и HTTPS (science.iubip.ru), здесь —
#  адрес по IP и порт 8080 без сертификата. Нужно на время пилота: домен и
#  сертификат — вопрос 2 ТЗ, он ещё не решён.
#
#  Приложение по-прежнему слушает только 127.0.0.1:8000 и наружу не
#  публикуется. Этот файл — единственная точка входа.
#
#  Файл самодостаточен: зоны ограничения частоты и заголовки проксирования
#  объявлены здесь же. Иначе установка на машину, где нет боевых файлов,
#  падала бы на nginx -t из-за отсутствующих include.
#
#  Установка:
#    sudo cp deploy/nginx/registry-local.conf /etc/nginx/sites-available/
#    sudo ln -s /etc/nginx/sites-available/registry-local.conf \
#          /etc/nginx/sites-enabled/registry-local.conf
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Если 8080 уже занят другой службой — не подменять её, а выбрать другой
#  порт: на этой машине живут и другие системы.
# =====================================================================

# Ограничение частоты (FR-33). Имена зон свои, с суффиксом local: если на
# машине когда-нибудь появится и боевая конфигурация, зоны не пересекутся.
limit_req_zone $binary_remote_addr zone=registry_local_public:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=registry_local_auth:10m rate=10r/m;

upstream registry_app_local {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Не афишировать версию сервера.
    server_tokens off;

    # Материалы к проектам: предел совпадает с UPLOAD_MAX_BYTES по умолчанию.
    client_max_body_size 25m;

    # Сжатие статики интерфейса.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Базовые заголовки безопасности. HSTS не ставится: HTTPS на этой
    # установке нет, а HSTS на HTTP-адресе заблокировал бы доступ по IP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Заголовки проксирования дублируют deploy/nginx/proxy-common.conf:
    # локальная установка не должна зависеть от боевых файлов.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    location /api/public/ {
        limit_req zone=registry_local_public burst=20 nodelay;
        proxy_pass http://registry_app_local;
    }

    # Вход и восстановление пароля — защита от подбора.
    location /api/auth/ {
        limit_req zone=registry_local_auth burst=10 nodelay;
        proxy_pass http://registry_app_local;
    }

    location / {
        proxy_pass http://registry_app_local;
    }
}
